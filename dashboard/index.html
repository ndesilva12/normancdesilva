<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Norman C. de Silva</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="site-header">
        <h1>Dashboard</h1>
    </header>
    <main class="container">
        <section class="tools-section">
            <h2>Tools</h2>
            <div class="tool-grid">
                <div class="tool-block large" id="curate"><h3>Curate</h3></div>
                <div class="tool-block large" id="l3d"><h3>L3D</h3></div>
                <div class="tool-block large" id="deep-search"><h3>Deep Search</h3></div>
                <div class="tool-block large" id="dark-search"><h3>Dark Search</h3></div>
                <div class="tool-block small" id="email"><h3>Email</h3></div>
                <div class="tool-block small" id="trending"><h3>Trending</h3></div>
                <div class="tool-block small" id="reader"><h3>Reader</h3></div>
                <div class="tool-block small" id="news"><h3>News</h3></div>
            </div>
        </section>
        <section class="preview-section" id="preview-area">
            <h2>Preview</h2>
            <div id="preview-content">
                <p>Click a tool to see a preview.</p>
            </div>
            <button id="view-full-tool" style="display: none;">View Full Tool</button>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
